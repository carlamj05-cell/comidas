<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COMIDAS</title>
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="COMIDAS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: una columna móvil (máx. 560px), cabecera fija arriba y barra de pestañas abajo.
   Modo oscuro por defecto (paleta de el usuario: #111214, #2A2D2F, #FF7A1A, #FFD0A6, #CFD4D7); modo claro con el botón de la cabecera. */
:root{
  --bg:#111214; --surface:#1A1C1E; --surface-2:#2A2D2F; --ink:#F4F5F6; --muted:#A3A9AD; --line:#2A2D2F;
  --accent:#FF7A1A; --accent-ink:#111214; --accent-soft:#2A1C11; --peach:#FFD0A6;
  --good:#7BD88F; --warn:#F5C451; --bad:#FF6B6B;
  --c-legumbre:#E0A458; --c-pescado:#6FB3F2; --c-blanca:#FF9F5A; --c-roja:#FF6B6B; --c-huevo:#F5D04A; --c-verdura:#7BD88F; --c-otro:#A3A9AD;
  --f-display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-body:"Figtree", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; color-scheme:dark;
}
:root[data-modo="claro"]{
  --bg:#F3F4F5; --surface:#FFFFFF; --surface-2:#E6E9EB; --ink:#111214; --muted:#5A6066; --line:#CFD4D7;
  --accent:#E0640C; --accent-ink:#FFFFFF; --accent-soft:#FFE8D4; --peach:#B4500A;
  --good:#1F8A43; --warn:#A86A00; --bad:#C4362F;
  --c-legumbre:#A86A12; --c-pescado:#2A6FB3; --c-blanca:#E0640C; --c-roja:#C4362F; --c-huevo:#B8920A; --c-verdura:#2F8A4E; --c-otro:#7A8085;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{min-height:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:1.4rem} h3{font-size:1.05rem}
.top{position:relative;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
.top h1{font-size:1.25rem;letter-spacing:-.01em}
.top h1 span{color:var(--accent)}
#sync{font-size:.78rem;color:var(--muted)}
.topr{display:flex;align-items:center;gap:10px}
.modo{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.modo svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
table.menu td.d{color:var(--accent)}
#sync.bad{color:var(--bad)}
main{max-width:560px;margin:0 auto;padding:14px 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);cursor:pointer;border-radius:10px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.card.accent{background:var(--accent-soft);border-color:var(--accent)}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.85rem}
p{margin:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip.static{cursor:default}
.chip.warm{border-color:var(--warn);color:var(--warn)}
.pill{display:inline-flex;align-items:center;font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.new{background:var(--accent);color:var(--accent-ink)}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:.92rem}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.daynav{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;text-align:center}
.daynav button{height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:1.4rem;cursor:pointer}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.meal header{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 6px}
.dish{display:grid;grid-template-columns:auto 1fr;align-items:start;gap:4px 10px;width:100%;text-align:left;background:none;border:0;border-left:4px solid var(--stripe,var(--c-otro));padding:8px 14px 8px 12px;margin:2px 0;cursor:pointer}
.dish .rol{font-size:.75rem;font-weight:700;color:var(--muted);padding-top:3px}
.dish .dname{font-weight:600}
.dish .tags{grid-column:2;display:flex;gap:4px;flex-wrap:wrap}
.dish:not(:has(.rol)){grid-template-columns:1fr}
.dish:not(:has(.rol)) .tags{grid-column:1}
.nota{padding:4px 14px 12px;font-size:.88rem;color:var(--muted)}
.counter{display:flex;align-items:center;gap:10px}
.counter button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.2rem;cursor:pointer}
.counter output{font-family:var(--f-display);font-size:1.6rem;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--surface-2);display:block}
.dots i.on{background:var(--accent)}
table.menu{width:100%;border-collapse:collapse;font-size:.86rem}
table.menu th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--peach);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
table.menu td{vertical-align:top;padding:8px 6px;border-bottom:1px solid var(--line)}
table.menu td.d{font-weight:700;font-family:var(--f-display);width:44px}
table.menu td.d small{display:block;font-family:var(--f-body);font-weight:500;color:var(--muted);font-size:.72rem}
table.menu tr.hoy td{background:var(--accent-soft)}
.mi{display:block;background:none;border:0;padding:0 0 0 7px;margin:0 0 4px;text-align:left;cursor:pointer;border-left:3px solid var(--stripe,var(--c-otro));line-height:1.3}
.mi.p1{color:var(--muted)}
.mi .n{font-size:.68rem;font-weight:700;color:var(--accent);margin-left:3px}
.tablewrap{overflow-x:auto}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--k);margin-right:4px;vertical-align:-1px}
ol,ul{margin:0;padding-left:1.2em}
li{margin:3px 0}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.cols2{grid-template-columns:1fr}}
.box{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.box h4{margin:0 0 4px;font-size:.85rem}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:.8rem;color:var(--muted)}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:var(--surface);flex:none;display:grid;place-items:center;cursor:pointer}
.check svg{width:16px;height:16px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.done .check{background:var(--accent);border-color:var(--accent)}
.done .check svg{opacity:1}
.done .t{text-decoration:line-through;color:var(--muted)}
.rowbtn{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.secthead{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--peach);font-weight:700;padding:10px 0 2px}
.estado{border:0;border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700;cursor:pointer;min-width:58px}
.estado.hay{background:var(--accent-soft);color:var(--good)}
.estado.poco{background:var(--surface-2);color:var(--warn)}
.estado.falta{background:var(--bad);color:#fff}
.x{border:0;background:none;color:var(--bad);font-size:1.2rem;cursor:pointer;padding:4px 8px}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form.grid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:1rem}
textarea{min-height:90px;resize:vertical}
label.cb{display:flex;align-items:center;gap:8px;font-size:.92rem;font-weight:500;color:var(--ink)}
label.cb input{width:20px;height:20px;accent-color:var(--accent)}
.big{font-family:var(--f-display);font-size:2.2rem;font-variant-numeric:tabular-nums;line-height:1}
.bar{position:relative;height:12px;border-radius:999px;background:var(--surface-2);overflow:visible}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.bar .fill.over{background:var(--bad)}
.bar .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.45}
.scale{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.eq{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.eq:last-child{border-bottom:0}
.eq .lbl{font-weight:600;display:flex;align-items:center;gap:8px}
.eq .lbl::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--k)}
.eq .seg{grid-column:1/-1;display:flex;gap:3px}
.eq .seg i{flex:1;height:8px;border-radius:3px;background:var(--surface-2)}
.eq .seg i.on{background:var(--k)}
.eq .seg i.tgt{outline:1px dashed var(--muted);outline-offset:-1px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:92px}
.tile b{font-family:var(--f-display);font-size:1.02rem}
.tile span{font-size:.82rem;color:var(--muted)}
.ai{white-space:pre-wrap;font-size:.94rem}
.ai.loading{color:var(--muted)}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:.92rem}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:30;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
.searchrow{display:flex;gap:8px}
.hscroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duo .btn{padding:12px 10px;text-align:center}
.mic svg,.duo svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mic.on{background:var(--bad);border-color:var(--bad);color:#fff}
.partial{font-size:.85rem;color:var(--muted);font-style:italic}
.opt{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.opt h3{font-size:1.02rem}
.lines{font-size:.86rem}
.lines .ln{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--accent);font-size:.82rem;font-weight:600;margin-top:2px}
.pill.menu{background:transparent;border:1px solid var(--accent);color:var(--accent)}
/* Calendario mensual en cuadrícula. En móvil cabe en el ancho con letra pequeña; en pantalla grande se ensancha. */
main.wide{max-width:1100px}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .h{background:var(--surface-2);color:var(--peach);font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:6px 2px}
.cal .c{background:var(--surface);min-height:92px;min-width:0;padding:4px 3px 6px;display:flex;flex-direction:column;align-items:stretch;gap:3px;text-align:left;border:0;border-radius:0;font:inherit;color:inherit}
.cal button.c{cursor:pointer}
.cal button.c:active{background:var(--surface-2)}
.cal .c.out{background:var(--bg)}
.cal .c.out .num{color:var(--muted);opacity:.5}
.cal .c.hoy{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .num{font-family:var(--f-display);font-weight:700;font-size:.82rem;display:flex;align-items:center;justify-content:space-between;gap:2px}
.cal .ml{font-size:.6rem;line-height:1.2;border-left:2px solid var(--stripe,var(--c-otro));padding-left:3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;hyphens:auto}
.cal .ml.ce{color:var(--muted)}
.cal .ml.vacio{border-left-color:var(--line);color:var(--muted);font-style:italic}
@media (min-width:700px){ .cal .c{min-height:118px;padding:6px 6px 8px;gap:5px} .cal .num{font-size:1rem} .cal .ml{font-size:.76rem;-webkit-line-clamp:4} .cal .h{font-size:.75rem;padding:8px 2px} }
.cdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);vertical-align:1px}
.dbtn{background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;font-weight:inherit;cursor:pointer;text-align:left;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.slotbox{display:flex;flex-direction:column;gap:8px}
.slotbox .now{display:flex;flex-wrap:wrap;gap:6px}
.radio{display:flex;align-items:flex-start;gap:8px;font-size:.92rem;cursor:pointer}
.radio input{width:20px;height:20px;accent-color:var(--accent);margin-top:1px;flex:none}
.login{max-width:420px;margin:24px auto 0}
.login h2{margin:0 0 4px}
.login .sep{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.82rem;margin:4px 0}
.login .sep:before,.login .sep:after{content:"";flex:1;height:1px;background:var(--line)}
.msg-bad{color:var(--c-roja)}
.msg-ok{color:var(--c-verdura)}
.impcols{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
</style>
</head>
<body>
<header class="top">
  <h1>COMI<span>DAS</span></h1>
  <div class="topr"><span id="sync">Cargando…</span><button class="modo" id="modo" data-act="modo-color" aria-label="Cambiar a modo claro"></button></div>
</header>
<main id="view"></main>
<nav class="tabs" aria-label="Secciones">
  <button data-act="go" data-r="hoy"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Hoy</button>
  <button data-act="go" data-r="semana"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Semana</button>
  <button data-act="go" data-r="recetario"><svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Recetario</button>
  <button data-act="go" data-r="compra"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.3"/><circle cx="17" cy="20" r="1.3"/></svg>Compra</button>
  <button data-act="go" data-r="mas"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Más</button>
</nav>
<div class="sheet-bg" id="sheetbg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ---------- modo oscuro / claro (oscuro por defecto) ---------- */
const ICON_SOL = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const ICON_MIC = '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const ICON_CHISPA = '<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>';
const ICON_LUNA = '<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
const ICON_PDF = '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
function aplicarModo(m){ document.documentElement.dataset.modo = m; const b = document.getElementById("modo"); if (b){ b.innerHTML = m === "claro" ? ICON_LUNA : ICON_SOL; b.setAttribute("aria-label", m === "claro" ? "Cambiar a modo oscuro" : "Cambiar a modo claro"); } }
let MODO = "oscuro"; try { MODO = localStorage.getItem("comidas-modo") || "oscuro"; } catch(e) {}
aplicarModo(MODO);
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = String(s).split("-").map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const dow = d => (d.getDay()+6)%7;
const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const DIAS3 = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const fmtLargo = d => `${DIAS[dow(d)]} ${d.getDate()} de ${MESES[d.getMonth()]}`;

const eur = n => (Number(n)||0).toLocaleString("es-ES", {style:"currency", currency:"EUR"});
const today = () => ymd(new Date());
const slug = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,60) || "item";
const SECCIONES = ["Fruta y verdura","Carne","Pescado","Huevos y lácteos","Despensa","Congelados","Otros"];

const OBJ_DEF = {legumbre:[3,4], pescado:[3,3], azul:[1,7], huevo:[3,4], blanca:[3,4], roja:[0,2]};

/* ---------- estado ---------- */
const COLS = ["recetas","menu","batch","despensa","compra","gastos","fuera","config","diario","cambios"];

};

/* ---------- semanas y rotación ---------- */
function rangosFuera(){ return Object.entries(S.data.fuera).map(([id,f]) => ({id, ...f})).filter(f => f.desde && f.hasta); }
function enFuera(ds){ return rangosFuera().find(f => ds >= f.desde && ds <= f.hasta) || null; }
function semanaEnteraFuera(mon){ for (let i=0;i<7;i++) if (!enFuera(ymd(addDays(mon,i)))) return false; return true; }
function inicio(){ return parse(cfg().inicio || "2026-11-23"); }
function weekInfo(ds){
  const d = parse(ds), mon = mondayOf(d), ini = mondayOf(inicio());
  const f = enFuera(ds);
  if (mon < ini) return { antes: true, fuera: f };
  let idx = 0;
  for (let w = new Date(ini); w < mon; w = addDays(w, 7)) if (!semanaEnteraFuera(w)) idx++;
  return { sem: (idx % 4) + 1, mon, fuera: f };
}
function proximasFechas(sem){
  let w = mondayOf(new Date()); if (w < mondayOf(inicio())) w = mondayOf(inicio());
  for (let i=0;i<20;i++){ const mon = addDays(w, i*7); if (semanaEnteraFuera(mon)) continue; const wi = weekInfo(ymd(mon)); if (wi.sem === sem) return mon; }
  return null;
}
/* Menú real de una fecha: el día de la rotación + los cambios puntuales guardados en cambios/{fecha}. */
function diaDe(ds){
  const wi = weekInfo(ds);
  if (wi.antes || wi.fuera || !wi.sem) return { wi, dia: null, base: null, cambio: null };
  const m = S.data.menu["s"+wi.sem];
  const base = m && Array.isArray(m.dias) ? (m.dias[dow(parse(ds))] || {}) : null;
  const c = S.data.cambios[ds] || null;
  if (!base && !c) return { wi, dia: null, base: null, cambio: null };
  const dia = Object.assign({}, base || {});
  if (c && c.comida) dia.comida = c.comida;
  if (c && c.cena) dia.cena = c.cena;
  return { wi, dia, base, cambio: c && (c.comida || c.cena) ? c : null };
}

/* ---------- conteo de equilibrio ---------- */
function contar(sem){
  const m = S.data.menu["s"+sem]; const c = {legumbre:0,pescado:0,azul:0,huevo:0,blanca:0,roja:0,nuevo:0};
  if (!m || !Array.isArray(m.dias)) return c;
  m.dias.forEach(d => ["comida","cena"].forEach(k => {
    const s = d && d[k]; if (!s) return;
    [["primero", s.primero], ["plato", s.plato]].forEach(([rol, id]) => {
      if (!id) return; const r = R(id);
      const cuenta = (rol === "plato" && Array.isArray(s.cuenta)) ? s.cuenta : (r.cuenta || []);
      cuenta.forEach(x => { if (x in c) c[x]++; });
      const azul = (rol === "plato" && typeof s.azul === "boolean") ? s.azul : !!r.azul;
      if (azul) c.azul++;
      if (r.nuevo) c.nuevo++;
    });
  }));
  return c;
}
function estadoObj(v, [a,b]){ return v < a ? "bad" : v > b ? "warn" : "good"; }

/* ---------- HTML de piezas ---------- */
function catDe(id, slot){ const r = R(id); const c = (slot && Array.isArray(slot.cuenta) ? slot.cuenta : r.cuenta || [])[0]; return c || r.cat || "verdura"; }
function tagsHtml(r){
  const t = [];
  if (r.nuevo) t.push(`<span class="pill new">Nuevo</span>`);
  if (r.paraMenu) t.push(`<span class="pill menu">Para el menú</span>`);
  if (r.tupper) t.push(`<span class="pill">Tupper</span>`);
  if (r.congela) t.push(`<span class="pill">Congela</span>`);
  if (r.tiempo) t.push(`<span class="pill">${esc(r.tiempo)} min</span>`);
  return t.length ? `<span class="tags">${t.join("")}</span>` : "";
}
function dishRow(id, rol, slot){
  const r = R(id);
  return `<button class="dish" data-act="receta" data-id="${esc(id)}" style="--stripe:var(--c-${catDe(id, slot)})">${rol ? `<span class="rol">${rol}</span>` : ""}<span class="dname">${esc(r.nombre)}</span>${tagsHtml(r)}</button>`;
}
function mealCard(t, s, label){
  if (!s) return "";
  const parts = [];
  if (s.primero) parts.push(dishRow(s.primero, "1º", null));
  if (s.plato) parts.push(dishRow(s.plato, s.primero ? "2º" : "", s));
  return `<article class="meal"><header><h3>${t}</h3>${label ? `<span class="pill">${esc(label)}</span>` : ""}</header>${parts.join("")}${s.nota ? `<p class="nota">${esc(s.nota)}</p>` : `<div style="height:8px"></div>`}</article>`;
}
function miniItem(id, slot, p1){
  const r = R(id);
  return `<button class="mi${p1?" p1":""}" data-act="receta" data-id="${esc(id)}" style="--stripe:var(--c-${catDe(id, p1?null:slot)})">${p1?"1º ":""}${esc(r.nombre)}${r.nuevo?`<span class="n">NUEVO</span>`:""}</button>`;
}
function slotMini(s){ if (!s) return `<span class="muted">-</span>`; return (s.primero ? miniItem(s.primero, null, true) : "") + (s.plato ? miniItem(s.plato, s, false) : ""); }
const LEYENDA = `<div class="legend">${["legumbre","pescado","blanca","roja","huevo","verdura"].map(k=>`<span style="--k:var(--c-${k})">${CATS[k]}</span>`).join("")}</div>`;

function frutaMes(m){ const f = (cfg().fruta || {})[String(m+1)]; return f || null; }

/* ---------- vistas ---------- */
const VIEWS = {};
VIEWS.hoy = () => {
  const ds = S.ui.day, d = parse(ds), wi = weekInfo(ds), esHoy = ds === today(), i = dow(d);
  let h = `<section class="daynav"><button data-act="day" data-n="-1" aria-label="Día anterior">‹</button><div><div class="eyebrow">${esHoy ? "Hoy" : (ds < today() ? "Día pasado" : "Próximamente")}</div><h2>${fmtLargo(d)}</h2></div><button data-act="day" data-n="1" aria-label="Día siguiente">›</button></section>`;
  if (!esHoy) h += `<button class="link" data-act="day" data-n="0">Volver a hoy</button>`;
  if (cuentaVacia()) h += `<section class="card accent"><h3>Bienvenido a COMIDAS</h3><p class="small">Tu cuenta está vacía. Si tienes un archivo de datos de COMIDAS (tuyo o que te haya pasado alguien), impórtalo y tendrás el recetario y el menú listos. También puedes empezar añadiendo platos en el Recetario.</p><div class="row"><button class="btn primary" data-act="go" data-r="cuenta">Importar datos</button><button class="btn" data-act="go" data-r="recetario">Ir al Recetario</button></div></section>`;
  const ini = inicio();
  if (wi.fuera){
    h += `<section class="card"><h3>Semana fuera</h3><p class="muted">${esc(wi.fuera.motivo || "Fuera de casa")} · del ${fmtCorto(parse(wi.fuera.desde))} al ${fmtCorto(parse(wi.fuera.hasta))}. No hay menú ni compra.</p></section>`;
  } else if (wi.antes){
    const dom = addDays(ini, -1);
    h += `<section class="card accent"><h3>Tu menú empieza el ${fmtLargo(ini).toLowerCase()}</h3><p>El ${fmtLargo(dom).toLowerCase()} toca batch cooking para la semana 1.</p><div class="row"><button class="btn primary" data-act="versem" data-s="1">Ver semana 1 y batch</button><button class="btn" data-act="setday" data-d="${ymd(ini)}">Ver el lunes</button></div></section>`;
  } else {
    const m = S.data.menu["s"+wi.sem];
    if (!m) h += `<div class="empty">${S.ready.has("menu") ? "No hay menú para la semana "+wi.sem+"." : "Cargando el menú…"}</div>`;
    else {
      const dd = diaDe(ds); const dia = dd.dia || {};
      h += `<div class="chips"><button class="chip" data-act="versem" data-s="${wi.sem}">Semana ${wi.sem} de 4</button>${dd.cambio ? `<span class="chip static warm">Cambiado</span>` : ""}</div>`;
      h += mealCard("Comida", dia.comida, i < 4 ? "Tupper" : "En casa");
      h += mealCard("Cena", dia.cena, "");
      h += `<button class="btn" data-act="dia" data-d="${ds}">Cambiar platos de este día</button>`;
    }
  }
  // batch cooking el domingo
  if (i === 6){
    const nx = weekInfo(ymd(addDays(d, 1)));
    if (nx.sem && !semanaEnteraFuera(addDays(d,1)) && S.data.batch["s"+nx.sem])
      h += `<section class="card accent"><h3>Hoy toca batch cooking</h3><p class="small">Para la semana ${nx.sem} que empieza mañana.</p><button class="btn primary" data-act="versem" data-s="${nx.sem}">Ver qué cocinar</button></section>`;
  }
  if (!wi.fuera){
    const dd = S.data.diario[ds] || {}; const n = Number(dd.fruta)||0;
    h += `<section class="card"><div class="row between"><div><div class="eyebrow">Fruta del día</div><div class="dots" aria-hidden="true">${[1,2,3].map(k=>`<i class="${n>=k?"on":""}"></i>`).join("")}</div></div><div class="counter"><button data-act="fruta" data-n="-1" aria-label="Quitar una pieza">−</button><output>${n}</output><button data-act="fruta" data-n="1" aria-label="Añadir una pieza">+</button></div></div>
    <label class="cb"><input type="checkbox" data-act="fsecos" ${dd.frutosSecos?"checked":""}> Hoy he tomado un puñado de frutos secos</label></section>`;
    const fm = frutaMes(d.getMonth());
    if (fm) h += `<section class="card"><div class="eyebrow">Fruta de temporada en ${MESES[d.getMonth()]}</div><div class="chips">${(fm.frutas||[]).map(f=>`<span class="chip static">${esc(f)}</span>`).join("")}</div>${(fm.ideas||[]).length?`<ul class="small">${fm.ideas.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</section>`;
  }

};
function aiCard(){
  if (!S.sample) return "";
  const a = S.ui.ai.hoy;
  return `<section class="card"><div class="eyebrow">Pregúntale a Claude</div><div class="row"><button class="btn" data-act="ai" data-k="desayuno">Sugiéreme desayuno</button><button class="btn" data-act="ai" data-k="cocino">¿Qué cocino con lo que tengo?</button></div>${a ? `<div id="ai-hoy" class="ai ${a.loading?"loading":""}">${esc(a.error || a.text || "Pensando…")}</div>` : ""}</section>`;
}

const MODOS = () => `<div class="row between"><div class="chips" role="tablist">${[["semana","Semana"],["mes","Mes en lista"],["cal","Calendario"]].map(([k,l])=>`<button class="chip" data-act="modo" data-v="${k}" aria-pressed="${(S.ui.modo||"semana")===k}">${l}</button>`).join("")}</div>${S.downloads ? `<button class="btn" data-act="pdf">${ICON_PDF}PDF</button>` : ""}</div>`;
const AYUDA_DIA = `<p class="small muted">Toca un día para cambiar su comida o su cena.</p>`;
function mesActual(){ const cur = today().slice(0,7); if (S.ui.mesMenu) return S.ui.mesMenu; const ini = ymd(inicio()).slice(0,7); return cur < ini ? ini : cur; }
function cabMes(y, m){ return `<div class="daynav"><button data-act="mesmenu" data-n="-1" aria-label="Mes anterior">‹</button><h2 style="text-transform:capitalize">${MESES[m-1]} ${y}</h2><button data-act="mesmenu" data-n="1" aria-label="Mes siguiente">›</button></div>`; }
/* Celda de día de las tablas: si hay menú ese día, se puede tocar para cambiar los platos. */
function celdaDia(i, d, editable, cambio){
  const t = `${DIAS3[i]}<small>${d.getDate()}${cambio ? ` <i class="cdot" title="Cambiado"></i>` : ""}</small>`;
  return `<td class="d">${editable ? `<button class="dbtn" data-act="dia" data-d="${ymd(d)}" aria-label="Cambiar platos del ${fmtLargo(d).toLowerCase()}">${t}</button>` : t}</td>`;
}
function vMes(){
  const [y,m] = mesActual().split("-").map(Number); const first = new Date(y, m-1, 1), last = new Date(y, m, 0);
  let h = MODOS() + cabMes(y, m);
  const hoyS = today(); let algo = false;
  for (let mon = mondayOf(first); mon <= last; mon = addDays(mon, 7)){
    const dias = []; for (let i=0;i<7;i++){ const d = addDays(mon,i); if (d >= first && d <= last) dias.push([i,d]); }
    const wi = weekInfo(ymd(mon)); const sun = addDays(mon,6);
    let head;
    if (wi.antes) head = `<span class="muted">Antes de empezar el menú</span>`;
    else if (semanaEnteraFuera(mon)) head = `<span class="muted">Semana fuera</span>`;
    else head = `<button class="link" data-act="versem" data-s="${wi.sem}">Semana ${wi.sem} de la rotación</button>`;
    const filas = dias.map(([i,d]) => { const ds = ymd(d); const dd = diaDe(ds); const dia = dd.dia;
      const vacio = `<span class="muted">${dd.wi.fuera ? "Fuera" : "-"}</span>`;
      return `<tr class="${ds===hoyS?"hoy":""}">${celdaDia(i, d, !!dia, !!dd.cambio)}<td>${dia?slotMini(dia.comida):vacio}</td><td>${dia?slotMini(dia.cena):vacio}</td></tr>`; }).join("");
    if (!wi.antes) algo = true;
    h += `<section class="card" style="padding:10px"><div class="row between" style="padding:0 6px"><b>${fmtCorto(mon)} - ${fmtCorto(sun)}</b>${head}</div><div class="tablewrap"><table class="menu"><thead><tr><th>Día</th><th>Comida</th><th>Cena</th></tr></thead><tbody>${filas}</tbody></table></div></section>`;
  }
  if (!algo) h += `<div class="empty">Este mes no tiene menú.</div>`;
  return h + LEYENDA + AYUDA_DIA;
}
/* Calendario mensual en cuadrícula (lunes a domingo), como un calendario de pared. */
function semanasCal(y, m){ const first = new Date(y, m-1, 1), last = new Date(y, m, 0); const out = []; for (let mon = mondayOf(first); mon <= last; mon = addDays(mon, 7)) out.push(mon); return { first, last, semanas: out }; }
function vCal(){
  const [y,m] = mesActual().split("-").map(Number); const { first, last, semanas } = semanasCal(y, m);
  const hoyS = today();
  const linea = (id, slot, cls) => { if (!id) return ""; const r = R(id); return `<span class="ml ${cls||""}" style="--stripe:var(--c-${catDe(id, slot)})">${esc(r.nombre)}</span>`; };
  let celdas = DIAS3.map(d => `<div class="h">${d}</div>`).join("");
  semanas.forEach(mon => { for (let i=0;i<7;i++){
    const d = addDays(mon, i), ds = ymd(d), dentro = d >= first && d <= last;
    if (!dentro){ celdas += `<div class="c out"><span class="num">${d.getDate()}</span></div>`; continue; }
    const dd = diaDe(ds); const dia = dd.dia;
    let cuerpo = "";
    if (dd.wi.fuera) cuerpo = `<span class="ml vacio">Fuera</span>`;
    else if (dia){
      const c = dia.comida || {}, ce = dia.cena || {};
      cuerpo = linea(c.plato || c.primero, c.plato ? c : null) + linea(ce.plato || ce.primero, ce.plato ? ce : null, "ce");
    }
    const num = `<span class="num">${d.getDate()}${dd.cambio ? `<i class="cdot" title="Cambiado"></i>` : ""}</span>`;
    celdas += dia ? `<button class="c${ds===hoyS?" hoy":""}" data-act="dia" data-d="${ds}" aria-label="${esc(fmtLargo(d))}">${num}${cuerpo}</button>`
                  : `<div class="c${ds===hoyS?" hoy":""}">${num}${cuerpo}</div>`;
  }});
  return MODOS() + cabMes(y, m) + `<div class="cal">${celdas}</div>` + LEYENDA + `<p class="small muted">En cada día, arriba la comida y abajo la cena (en gris). Toca un día para ver el primero y cambiar los platos.</p>`;
}
VIEWS.semana = () => {
  if (S.ui.modo === "mes") return vMes();
  if (S.ui.modo === "cal") return vCal();
  const cur = weekInfo(today()); const def = cur.sem || 1; const sem = S.ui.sem || def;
  const m = S.data.menu["s"+sem]; const mon = proximasFechas(sem);
  let h = MODOS() + `<div class="row between"><h2>Semana ${sem}</h2>${mon ? `<span class="muted small">${sem===cur.sem && !cur.antes ? "Esta semana" : "Próxima"}: ${fmtCorto(mon)} - ${fmtCorto(addDays(mon,6))}</span>` : ""}</div>`;
  h += `<div class="chips">${[1,2,3,4].map(n=>`<button class="chip" data-act="sem" data-s="${n}" aria-pressed="${n===sem}">S${n}${n===cur.sem && !cur.antes ? " · ahora" : ""}</button>`).join("")}</div>`;
  if (!m) return h + `<div class="empty">${S.ready.has("menu") ? "Esta semana aún no tiene menú." : "Cargando…"}</div>`;
  const c = contar(sem), o = OBJ();
  h += `<div class="chips">${[["legumbre","Legumbre"],["pescado","Pescado"],["huevo","Huevos"],["blanca","Blanca"],["roja","Roja"]].map(([k,l])=>`<span class="pill ${estadoObj(c[k],o[k])}">${l} ${c[k]}</span>`).join("")}<span class="pill ${c.azul>=1?"good":"bad"}">Azul ${c.azul}</span>${c.nuevo?`<span class="pill new">${c.nuevo} nuevo${c.nuevo>1?"s":""}</span>`:""}</div>`;
  const hoyIdx = (cur.sem === sem && !cur.antes) ? dow(new Date()) : -1;
  h += `<section class="card" style="padding:10px"><div class="tablewrap"><table class="menu"><thead><tr><th>Día</th><th>Comida</th><th>Cena</th></tr></thead><tbody>${(m.dias||[]).map((d,i)=>{
    if (!mon) return `<tr class="${i===hoyIdx?"hoy":""}"><td class="d">${DIAS3[i]}</td><td>${slotMini(d.comida)}</td><td>${slotMini(d.cena)}</td></tr>`;
    const fd = addDays(mon,i); const dd = diaDe(ymd(fd)); const x = dd.dia || d;
    return `<tr class="${i===hoyIdx?"hoy":""}">${celdaDia(i, fd, !!dd.dia, !!dd.cambio)}<td>${slotMini(x.comida)}</td><td>${slotMini(x.cena)}</td></tr>`; }).join("")}</tbody></table></div>${LEYENDA}${mon ? AYUDA_DIA : ""}</section>`;
  if (m.fruta) h += `<section class="card"><div class="eyebrow">Fruta de la semana</div><p>${esc(m.fruta)}</p></section>`;
  const b = S.data.batch["s"+sem];
  if (b) h += batchHtml(b);
  return h;
};
function batchHtml(b){
  const lst = a => (a||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  return `<section class="card"><div><div class="eyebrow">Batch cooking</div><h3>${esc(b.titulo || "Domingo")}</h3>${b.duracion?`<p class="muted small">${esc(b.duracion)}</p>`:""}</div>
  ${b.previo&&b.previo.length?`<div class="box"><h4>Antes de empezar</h4><ul class="small">${lst(b.previo)}</ul></div>`:""}
  ${b.pasos&&b.pasos.length?`<div><h4 style="margin:0 0 4px">Orden</h4><ol>${lst(b.pasos)}</ol></div>`:""}

VIEWS.recetario = () => {
  let h = `<div class="row between"><h2>Recetario</h2><button class="btn" data-act="nueva-receta">+ A mano</button></div>
  ${S.sample ? `<div class="duo"><button class="btn primary" data-act="dictar">${ICON_MIC}Dictar receta</button><button class="btn primary" data-act="ideas">${ICON_CHISPA}Pedir ideas</button></div>` : ""}
  <div class="searchrow"><input type="search" id="q" placeholder="Buscar plato o ingrediente" value="${esc(S.ui.q)}" aria-label="Buscar"></div>
  <div class="hscroll">${[["todos","Todos"],["comida","Comidas"],["primero","Primeros"],["cena","Cenas"],["desayuno","Desayunos"]].map(([k,l])=>`<button class="chip" data-act="ftipo" data-v="${k}" aria-pressed="${S.ui.ftipo===k}">${l}</button>`).join("")}</div>
  <div class="hscroll">${["legumbre","pescado","blanca","roja","huevo","verdura"].map(k=>`<button class="chip" data-act="fprot" data-v="${k}" aria-pressed="${S.ui.fprot===k}">${CATS[k]}</button>`).join("")}${[["paraMenu","Para el menú"],["tupper","Tupper"],["congela","Congela"],["nuevo","Nuevo"]].map(([k,l])=>`<button class="chip" data-act="ftag" data-v="${k}" aria-pressed="${S.ui.ftags.includes(k)}">${l}</button>`).join("")}</div>
  <section class="card" style="padding:4px 14px" id="rlist">${recetasLista()}</section>`;
  return h;
};
function recetasLista(){
  const q = S.ui.q.trim() ? slug(S.ui.q).replace(/-/g," ") : "";
  const arr = Object.entries(S.data.recetas).map(([id,r])=>({id,...r})).filter(r => {
    if (S.ui.ftipo !== "todos" && r.tipo !== S.ui.ftipo) return false;
    if (S.ui.fprot && !((r.cuenta||[]).includes(S.ui.fprot) || r.cat === S.ui.fprot)) return false;
    for (const t of S.ui.ftags) if (!r[t]) return false;
    if (q){ const hay = slug((r.nombre||"")+" "+(r.ingredientes||[]).join(" ")).replace(/-/g," "); if (!hay.includes(q)) return false; }
    return true;
  }).sort((a,b)=> (a.tipo||"").localeCompare(b.tipo||"") || (a.nombre||"").localeCompare(b.nombre||"", "es"));
  if (!arr.length) return `<div class="empty">${S.ready.has("recetas") ? "Ningún plato con esos filtros." : "Cargando recetario…"}</div>`;
  let last = null, h = "";
  arr.forEach(r => {
    if (r.tipo !== last){ h += `<div class="secthead">${esc(TIPOS[r.tipo] || "Otros")}</div>`; last = r.tipo; }
    h += `<div class="item"><button class="rowbtn" data-act="receta" data-id="${esc(r.id)}"><span style="width:4px;align-self:stretch;border-radius:2px;background:var(--c-${(r.cuenta||[])[0]||r.cat||"verdura"})"></span><span class="grow"><span class="t">${esc(r.nombre)}</span><br>${tagsHtml(r)}</span></button></div>`;
  });
  return `<div class="list">${h}</div>`;
}

VIEWS.compra = () => {
  const items = Object.entries(S.data.compra).map(([id,x])=>({id,...x}));
  const listas = [...new Map(items.map(x=>[x.lista, x.listaNombre || x.lista])).entries()].sort((a,b)=>String(b[0]).localeCompare(String(a[0])));
  const faltan = Object.entries(S.data.despensa).map(([id,x])=>({id,...x})).filter(x=>x.estado==="falta" || x.estado==="poco");
  let lista = S.ui.lista && listas.some(l=>l[0]===S.ui.lista) ? S.ui.lista : (listas[listas.length-1]||[])[0];
  // por defecto, la lista más reciente que tenga cosas sin tachar
  if (!S.ui.lista){ const pend = listas.filter(([l])=>items.some(x=>x.lista===l && !x.hecho)); if (pend.length) lista = pend[pend.length-1][0]; }
  let h = `<div class="row between"><h2>Compra</h2></div>`;
  if (listas.length > 1) h += `<div class="hscroll">${listas.map(([l,n])=>`<button class="chip" data-act="lista" data-v="${esc(l)}" aria-pressed="${l===lista}">${esc(n)}</button>`).join("")}</div>`;
  if (faltan.length) h += `<section class="card"><div class="eyebrow">Básicos que se acaban</div><div class="list">${faltan.map(x=>`<div class="item"><span class="grow"><span class="t">${esc(x.nombre)}</span></span><button class="estado ${x.estado}" data-act="desp-estado" data-id="${esc(x.id)}">${x.estado==="falta"?"Falta":"Poco"}</button></div>`).join("")}</div><p class="small muted">Toca para marcar que ya lo tienes.</p></section>`;
  const mine = items.filter(x=>x.lista===lista);
  if (!mine.length) h += `<div class="empty">${S.ready.has("compra") ? "No hay lista de la compra todavía." : "Cargando…"}</div>`;
  else {
    const hechos = mine.filter(x=>x.hecho).length;
    h += `<div class="row between"><span class="muted small">${hechos} de ${mine.length} en el carro</span>${hechos?`<button class="link" data-act="limpiar" data-v="${esc(lista)}">Quitar tachados</button>`:""}</div><div class="bar"><div class="fill" style="width:${Math.round(100*hechos/mine.length)}%"></div></div>`;
    const bloques = [...new Set(mine.map(x=>x.bloque||""))];
    bloques.forEach(bq => {
      const enB = mine.filter(x=>(x.bloque||"")===bq);
      h += `<section class="card" style="padding:6px 14px 10px">${bq?`<h3 style="padding-top:8px">${esc(bq)}</h3>`:""}`;
      [...SECCIONES, ...new Set(enB.map(x=>x.seccion).filter(s=>!SECCIONES.includes(s)))].forEach(sec => {
        const xs = enB.filter(x=>(x.seccion||"Otros")===sec).sort((a,b)=>(a.hecho-b.hecho)||((a.orden||0)-(b.orden||0)));
        if (!xs.length) return;
        h += `<div class="secthead">${esc(sec)}</div><div class="list">${xs.map(x=>`<div class="item ${x.hecho?"done":""}"><button class="rowbtn" data-act="tachar" data-id="${esc(x.id)}" aria-pressed="${!!x.hecho}"><span class="check"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span><span class="grow"><span class="t">${esc(x.nombre)}</span>${x.cantidad||x.nota?`<br><span class="s">${esc([x.cantidad,x.nota].filter(Boolean).join(" · "))}</span>`:""}</span></button></div>`).join("")}</div>`;
      });
      h += `</section>`;
    });
  }
  h += `<section class="card"><div class="eyebrow">Añadir a la lista</div><form class="grid" data-form="compra-add"><label class="f full">Producto<input type="text" name="nombre" id="ca-nombre" required></label><label class="f">Cantidad<input type="text" name="cantidad" id="ca-cant"></label><label class="f">Sección<select name="seccion" id="ca-sec">${SECCIONES.map(s=>`<option>${s}</option>`).join("")}</select></label><input type="hidden" name="lista" value="${esc(lista||"extra")}"><button class="btn primary full">Añadir</button></form></section>`;
  return h;
};

VIEWS.mas = () => {

};

VIEWS.equilibrio = () => {
  const cur = weekInfo(today()); const sem = S.ui.sem || cur.sem || 1; const c = contar(sem), o = OBJ();
  const filas = [["legumbre","Legumbre","legumbre"],["pescado","Pescado","pescado"],["azul","De ellos, azul","pescado"],["huevo","Huevos","huevo"],["blanca","Carne blanca","blanca"],["roja","Carne roja o procesada","roja"]];
  let h = `<button class="link" data-act="go" data-r="mas">‹ Más</button><h2>Equilibrio</h2><div class="chips">${[1,2,3,4].map(n=>`<button class="chip" data-act="sem" data-s="${n}" aria-pressed="${n===sem}">Semana ${n}</button>`).join("")}</div>`;
  h += `<section class="card">${filas.map(([k,l,col])=>{ const [a,b]=o[k]; const max=Math.max(b,c[k],4); const txt = k==="azul" ? `mín. ${a}` : (a===b?`${a}`:(a===0?`máx. ${b}`:`${a}-${b}`)); return `<div class="eq" style="--k:var(--c-${col})"><span class="lbl">${l}</span><span class="pill ${estadoObj(c[k], k==="azul"?[a,99]:[a,b])}">${c[k]} · objetivo ${txt}</span><div class="seg">${Array.from({length:max},(_,i)=>`<i class="${i<c[k]?"on":""} ${i<(k==="azul"?a:b)&&i>=c[k]?"tgt":""}"></i>`).join("")}</div></div>`; }).join("")}<p class="small muted">Verdura en todas las comidas y cenas del menú. Hidratos integrales siempre que se pueda.</p></section>`;
  // fruta real de esta semana natural
  const mon = mondayOf(new Date()); let tot=0, dias=0, fs=0;
  for (let i=0;i<7;i++){ const dd = addDays(mon,i); if (ymd(dd) > today()) break; dias++; const r = S.data.diario[ymd(dd)]||{}; tot += Number(r.fruta)||0; if (r.frutosSecos) fs++; }
  const media = dias ? tot/dias : 0;
  h += `<section class="card"><div class="eyebrow">Esta semana (lo que apuntas en Hoy)</div><div class="eq" style="--k:var(--c-verdura)"><span class="lbl">Fruta</span><span class="pill ${media>=2?"good":"warn"}">${media.toFixed(1).replace(".",",")} piezas/día · objetivo 2-3</span></div><div class="eq" style="--k:var(--c-legumbre)"><span class="lbl">Frutos secos</span><span class="pill ${fs>=3?"good":"warn"}">${fs} día${fs===1?"":"s"} · objetivo varios</span></div></section>`;
  return h;
};

function despForm(){ return `<section class="card"><div class="eyebrow">Añadir a la despensa</div><form class="grid" data-form="desp-add"><label class="f full">Producto<input type="text" name="nombre" id="da-nombre" required></label><label class="f">Sección<select name="seccion" id="da-sec">${SECCIONES.map(s=>`<option ${s==="Despensa"?"selected":""}>${s}</option>`).join("")}</select></label><label class="f">Cantidad<input type="text" name="cantidad" id="da-cant" placeholder="opcional"></label><label class="cb full"><input type="checkbox" name="basico" id="da-bas"> Básico fijo (siempre en casa)</label><button class="btn primary full">Añadir</button></form></section>`; }

VIEWS.gasto = () => {
  const mes = S.ui.mes || today().slice(0,7); const [y,m] = mes.split("-").map(Number);
  const gs = Object.entries(S.data.gastos).map(([id,g])=>({id,...g})).filter(g=>String(g.fecha||"").startsWith(mes)).sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
  const tot = gs.reduce((a,g)=>a+(Number(g.importe)||0),0);
  const rg = cfg().rango || {min:250,max:350}; const top = Math.max(rg.max*1.2, tot*1.05);
  const est = tot > rg.max ? ["bad", `Te has pasado ${eur(tot-rg.max)}`] : tot >= rg.min ? ["good","Dentro de tu rango"] : ["", `Te quedan ${eur(rg.max-tot)} hasta el máximo`];
  const porSuper = {}; gs.forEach(g=>porSuper[g.super||"Otro"]=(porSuper[g.super||"Otro"]||0)+(Number(g.importe)||0));
  let h = `<button class="link" data-act="go" data-r="mas">‹ Más</button><div class="daynav"><button data-act="mes" data-n="-1" aria-label="Mes anterior">‹</button><h2 style="text-transform:capitalize">${MESES[m-1]} ${y}</h2><button data-act="mes" data-n="1" aria-label="Mes siguiente">›</button></div>`;
  h += `<section class="card"><div class="row between"><span class="big">${eur(tot)}</span><span class="pill ${est[0]}">${est[1]}</span></div><div class="bar"><div class="fill ${tot>rg.max?"over":""}" style="width:${Math.min(100,100*tot/top)}%"></div><span class="mark" style="left:${100*rg.min/top}%"></span><span class="mark" style="left:${100*rg.max/top}%"></span></div><div class="scale" style="position:relative;height:14px"><span style="position:absolute;left:0">0 €</span><span style="position:absolute;left:${100*rg.min/top}%;transform:translateX(-50%)">${rg.min} €</span><span style="position:absolute;left:${100*rg.max/top}%;transform:translateX(-50%)">${rg.max} €</span></div>${Object.keys(porSuper).length?`<div class="chips">${Object.entries(porSuper).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<span class="chip static">${esc(s)} ${eur(v)}</span>`).join("")}</div>`:""}</section>`;
  if (S.sampleImg) h += `<section class="card"><div class="eyebrow">Foto del ticket</div><p class="small muted">Haz una foto al ticket o súbela. Claude lee la fecha, el súper, el total y los productos, y tú lo revisas antes de guardar.</p><label class="btn primary block" for="ticket-file">Hacer o subir foto</label><input type="file" id="ticket-file" accept="image/*" hidden>${S.ui.ticketMsg?`<p class="ai ${S.ui.ticketMsg.startsWith("Leyendo")?"loading":""}">${esc(S.ui.ticketMsg)}</p>`:""}</section>`;
  const porSec = {}; gs.forEach(g => (g.lineas||[]).forEach(l => porSec[l.seccion||"Otros"] = (porSec[l.seccion||"Otros"]||0) + (Number(l.importe)||0)));
  if (Object.keys(porSec).length) h += `<section class="card"><div class="eyebrow">En qué se va (tickets con foto)</div><div class="chips">${Object.entries(porSec).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<span class="chip static">${esc(s)} ${eur(v)}</span>`).join("")}</div></section>`;
  h += `<section class="card"><div class="eyebrow">Apuntar ticket a mano</div><form class="grid" data-form="gasto-add"><label class="f">Fecha<input type="date" name="fecha" id="g-fecha" value="${today()}" required></label><label class="f">Importe (€)<input type="number" name="importe" id="g-imp" step="0.01" min="0" inputmode="decimal" required></label><label class="f">Súper<select name="super" id="g-sup">${SUPERS.map(s=>`<option>${s}</option>`).join("")}</select></label><label class="f">Nota<input type="text" name="nota" id="g-nota" placeholder="opcional"></label><button class="btn primary full">Guardar ticket</button></form></section>`;
  h += `<section class="card" style="padding:4px 14px">${gs.length ? `<div class="list">${gs.map(g=>`<div class="item"><span class="grow"><span class="t">${esc(g.super||"Otro")} · ${eur(g.importe)}</span><br><span class="s">${fmtLargo(parse(g.fecha))}${g.nota?" · "+esc(g.nota):""}</span>${(g.lineas||[]).length?`<details><summary>${g.lineas.length} productos</summary>${lineasHtml(g.lineas)}</details>`:""}</span><button class="x" data-act="gasto-del" data-id="${esc(g.id)}" aria-label="Borrar ticket">×</button></div>`).join("")}</div>` : `<div class="empty">Sin tickets este mes.</div>`}</section>`;
  return h;
};

  const li = r => `<div class="item"><button class="rowbtn" data-act="receta" data-id="${esc(r.id)}"><span style="width:4px;align-self:stretch;border-radius:2px;background:var(--c-${(r.cuenta||[])[0]||r.cat||"verdura"})"></span><span class="grow"><span class="t">${esc(r.nombre)}</span> ${r.nuevo?`<span class="pill new">Nuevo</span>`:""}</span></button></div>`;

function leerArchivo(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const j = JSON.parse(String(r.result)); const datos = j && j.datos && typeof j.datos === "object" ? j.datos : j;
      const cuenta = {}; let total = 0;
      COLS.forEach(c => { const v = datos && datos[c]; if (v && typeof v === "object" && !Array.isArray(v)){ const k = Object.keys(v).filter(id => v[id] && typeof v[id] === "object").length; if (k){ cuenta[c] = k; total += k; } } });
      if (!total) throw new Error("vacío");
      S.ui.imp = { nombre: file.name, datos, cuenta, total }; S.ui.impMsg = null;

function aiErr(e, def){ const c = e && e.code; if (c === "not_granted"){ S.sample = null; return "No tengo permiso para preguntar a Claude desde la app."; } if (c === "rate_limited") return "Muchas peticiones seguidas. Prueba en un rato."; return def; }
async function pideJSON(prompt, opts){ const r = await S.sample(prompt, Object.assign({ cache: false }, opts || {})); const t = String(r.text || ""); const m = t.match(/\{[\s\S]*\}/); return JSON.parse(m ? m[0] : t); }
const ESQUEMA_RECETA = `{"nombre": texto, "tipo": "comida" | "primero" | "cena" | "desayuno", "prot": "legumbre" | "pescado" | "blanca" | "roja" | "huevo" | "verdura" | "otro", "cuenta": [grupos que cuentan en su equilibrio], "azul": true o false, "tupper": true o false, "congela": true o false, "tiempo": minutos (número), "raciones": texto corto, "ingredientes": [textos con cantidad], "pasos": [4 a 8 pasos cortos], "conserva": una frase sobre nevera y congelador, "notas": una frase o ""}`;
const REGLAS_RECETA = `Reglas: "tipo" es "comida" si es un plato principal contundente de mediodía, "cena" si es ligero (proteína y verdura, poco hidrato), "primero" si es una verdura, crema o guarnición y "desayuno" si es de desayuno. "cuenta" son los grupos de proteína que cuentan en su equilibrio semanal (legumbre, pescado, blanca, roja, huevo); un plato puede tener dos, como un potaje con bacalao. Carne blanca: pollo, pavo, conejo y cerdo magro (solomillo, lomo). Carne roja o procesada: ternera, cordero, carne picada de ternera, cerdo graso y embutidos. "azul" es true si lleva pescado azul (salmón, caballa, sardina, boquerón, atún fresco). "tupper" es true si aguanta 3 días en nevera y se recalienta bien en microondas sin oler fuerte. Usa airfryer, vitrocerámica o microondas, nunca horno. Cantidades para una persona, o 2 raciones si es de tupper. Español de España, sin rayas largas.`;
function normReceta(j){
  j = j || {}; const G = ["legumbre","pescado","blanca","roja","huevo"]; const arr = a => (Array.isArray(a) ? a : []).map(x => String(x)).filter(Boolean);
  let cuenta = arr(j.cuenta).filter(x => G.includes(x)); const prot = CATS[j.prot] ? j.prot : (cuenta[0] || "otro");
  if (G.includes(prot)) cuenta = [prot, ...cuenta.filter(x => x !== prot)];
  return { nombre: String(j.nombre || "Receta sin nombre").slice(0,120), tipo: TIPOS[j.tipo] ? j.tipo : "comida", prot, cat: prot, cuenta, azul: !!j.azul, tupper: !!j.tupper, congela: !!j.congela,
    tiempo: Number(j.tiempo) || null, raciones: String(j.raciones || ""), ingredientes: arr(j.ingredientes), pasos: arr(j.pasos), conserva: String(j.conserva || ""), notas: String(j.notas || ""), resumen: String(j.resumen || "") };
}
async function reducirImagen(file, max){
  try{ const bmp = await createImageBitmap(file); const k = Math.min(1, max / Math.max(bmp.width, bmp.height)); const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", 0.85)); }
  catch(e){ return file; }
}
async function procesarTicket(file){
  S.ui.ticketMsg = "Leyendo el ticket…"; render();
  try{
    const blob = await reducirImagen(file, 1600);
    const j = await pideJSON(`Lee este ticket de compra de supermercado de el usuario. Devuelve SOLO un objeto JSON: {"fecha": "AAAA-MM-DD" o null si no se lee, "super": "Mercadona" | "Lidl" | "Carrefour" | "Primaprix" | "Otro", "total": total pagado en euros (número), "lineas": [{"nombre": nombre claro del producto, "importe": euros (número), "seccion": "Fruta y verdura" | "Carne" | "Pescado" | "Huevos y lácteos" | "Despensa" | "Congelados" | "Otros"}]}. Los tickets abrevian: escribe nombres claros (por ejemplo "PECH. POLLO" es "Pechuga de pollo"). Si hay un descuento, réstalo al producto al que se aplica. No inventes productos que no se lean.`, { images: [blob] });
    const lineas = (Array.isArray(j.lineas) ? j.lineas : []).map(l => ({ nombre: String(l.nombre||"").slice(0,80), importe: Math.round((Number(l.importe)||0)*100)/100, seccion: SECCIONES.includes(l.seccion) ? l.seccion : "Otros" })).filter(l => l.nombre);
    const total = Number(j.total) || lineas.reduce((a,l)=>a+l.importe,0);
    S.ui.ticket = { fecha: /^\d{4}-\d{2}-\d{2}$/.test(j.fecha||"") ? j.fecha : today(), super: SUPERS.includes(j.super) ? j.super : "Otro", total: Math.round(total*100)/100, lineas };
    S.ui.ticketMsg = ""; render(); openSheet(sheetTicket());
  } catch(e){ S.ui.ticketMsg = aiErr(e, "No he podido leer el ticket. Prueba con una foto más nítida, recta y con buena luz."); render(); }
}

    if (await W(S.db.collection("fuera").add({ desde, hasta, motivo: String(fd.get("motivo")||"").trim() }), "Guardado")) f.reset(); },
};
document.addEventListener("submit", e => { e.preventDefault(); const f = e.target; if (f.dataset.form === "login"){ FORMS.login(f); return; } if (!S.db){ toast("Sin conexión con los datos"); return; } const fn = FORMS[f.dataset.form]; if (fn) fn(f); });

/* ---------- PDF de la vista actual (calendario, mes en lista o semana) ---------- */
const PDF_COL = { legumbre:[224,164,88], pescado:[42,111,179], blanca:[224,100,12], roja:[196,54,47], huevo:[184,146,10], verdura:[47,138,78], otro:[122,128,133] };
let jsPDFp = null;
function cargarJsPDF(){
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (!jsPDFp) jsPDFp = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = () => (window.jspdf && window.jspdf.jsPDF) ? res(window.jspdf.jsPDF) : rej(new Error("jspdf")); s.onerror = () => { jsPDFp = null; rej(new Error("jspdf")); }; document.head.appendChild(s); });
  return jsPDFp;
}
// Las fuentes base del PDF solo llevan Latin-1: tildes, ñ, º y · sí; lo demás se cambia o se quita.
const pdfTxt = s => String(s ?? "").replace(/[–—]/g, "-").replace(/…/g, "...").replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[^\x00-\xFF]/g, "");
const capi = s => s.charAt(0).toUpperCase() + s.slice(1);
function itemsDe(s){ if (!s) return []; const out = []; if (s.primero) out.push([catDe(s.primero, null), "1º " + R(s.primero).nombre]); if (s.plato) out.push([catDe(s.plato, s), R(s.plato).nombre]); return out; }
function lineaH(size){ return size * 0.3528 * 1.2; }
function altoItems(doc, items, w, size){ doc.setFontSize(size); let n = 0; items.forEach(([,t]) => { n += doc.splitTextToSize(pdfTxt(t), w - 2.6).length; }); return n * lineaH(size) + Math.max(0, items.length - 1) * lineaH(size) * 0.25; }
function pdfItems(doc, items, x, y, w, maxY, size){
  doc.setFontSize(size); const lh = lineaH(size);
  for (const [cat, t] of items){
    const lines = doc.splitTextToSize(pdfTxt(t), w - 2.6);
    for (const ln of lines){
      if (y + lh > maxY) return y;
      doc.setFillColor(...(PDF_COL[cat] || PDF_COL.otro)); doc.rect(x, y + lh * 0.12, 0.9, lh * 0.82, "F");
      doc.text(ln, x + 2.2, y + lh * 0.78); y += lh;
    }
    y += lh * 0.25;
  }
  return y;
}
function pdfLeyenda(doc, x, y){
  doc.setFontSize(7.5); doc.setTextColor(110);
  ["legumbre","pescado","blanca","roja","huevo","verdura"].forEach(k => { doc.setFillColor(...PDF_COL[k]); doc.rect(x, y - 2.4, 2.6, 2.6, "F"); doc.text(pdfTxt(CATS[k]), x + 3.6, y); x += doc.getTextWidth(pdfTxt(CATS[k])) + 9; });
}
function pdfCal(J, y, m){
  const doc = new J({ orientation: "landscape", unit: "mm", format: "a4" });
  const W = 297, H = 210, M = 10, top = 22, hh = 9, legH = 7;
  const { first, last, semanas } = semanasCal(y, m);
  const cw = (W - 2*M) / 7, ch = (H - top - hh - M - legH) / semanas.length, fs = semanas.length > 5 ? 6.4 : 7;
  doc.setFont("helvetica", "normal"); doc.setTextColor(110); doc.setFontSize(24); doc.text(pdfTxt(capi(MESES[m-1]) + " " + y), M, 17);
  doc.setFontSize(9); doc.setTextColor(150); doc.text("COMIDAS", W - M, 17, { align: "right" });
  doc.setFillColor(128, 128, 128); doc.rect(M, top, W - 2*M, hh, "F");
  doc.setTextColor(255); doc.setFontSize(11); DIAS.forEach((d, i) => doc.text(pdfTxt(d), M + cw*i + cw/2, top + 6.2, { align: "center" }));
  doc.setDrawColor(160); doc.setLineWidth(0.2);
  semanas.forEach((mon, r) => { for (let i = 0; i < 7; i++){
    const d = addDays(mon, i), x = M + cw*i, yy = top + hh + ch*r, dentro = d >= first && d <= last;
    if (!dentro){ doc.setFillColor(242, 242, 242); doc.rect(x, yy, cw, ch, "F"); }
    doc.rect(x, yy, cw, ch, "S");
    doc.setFontSize(12); doc.setTextColor(dentro ? 110 : 175); doc.text(String(d.getDate()), x + 2, yy + 5.6);
    if (!dentro) continue;
    const dd = diaDe(ymd(d)); const maxY = yy + ch - 1;
    if (dd.wi.fuera){ doc.setFontSize(8); doc.setTextColor(150); doc.text("Fuera", x + 2, yy + 11); continue; }
    if (!dd.dia) continue;
    if (dd.cambio){ doc.setFillColor(224, 100, 12); doc.circle(x + cw - 3, yy + 3.9, 0.9, "F"); }
    let cy = yy + 7.4;
    doc.setFontSize(5.6); doc.setTextColor(150); doc.text("COMIDA", x + 2, cy + 2); cy += 2.9;
    doc.setTextColor(40); cy = pdfItems(doc, itemsDe(dd.dia.comida), x + 2, cy, cw - 4, maxY, fs) + 0.4;
    if (cy + 4.5 < maxY){ doc.setFontSize(5.6); doc.setTextColor(150); doc.text("CENA", x + 2, cy + 2); cy += 2.9; doc.setTextColor(40); pdfItems(doc, itemsDe(dd.dia.cena), x + 2, cy, cw - 4, maxY, fs); }
  }});
  pdfLeyenda(doc, M, H - M + 1);
  return doc;
}
/* PDF vertical con tablas Día / Comida / Cena: sirve para el mes en lista y para la semana. */
function pdfLista(J, titulo, sub, bloques, extras){
  const doc = new J({ orientation: "portrait", unit: "mm", format: "a4" });
  const W = 210, H = 297, M = 12, dw = 20, colW = (W - 2*M - dw) / 2, fs = 8.5, lh = lineaH(fs);
  doc.setFont("helvetica", "normal");
  doc.setTextColor(60); doc.setFontSize(20); doc.text(pdfTxt(titulo), M, 20);
  doc.setFontSize(9); doc.setTextColor(140); doc.text(pdfTxt(sub || "COMIDAS"), M, 26);
  let y = 32;
  const cabecera = () => { doc.setFillColor(128,128,128); doc.rect(M, y, W - 2*M, 7, "F"); doc.setTextColor(255); doc.setFontSize(9); doc.text("Día", M + 2, y + 4.8); doc.text("Comida", M + dw + 2, y + 4.8); doc.text("Cena", M + dw + colW + 2, y + 4.8); y += 7; };
  bloques.forEach(b => {
    if (y + 24 > H - M){ doc.addPage(); y = M + 4; }
    doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(60); doc.text(pdfTxt(b.titulo), M, y + 4); doc.setFont("helvetica", "normal"); y += 7;
    cabecera();
    b.filas.forEach(f => {
      const h = Math.max(lh, altoItems(doc, f.comida, colW - 3, fs), altoItems(doc, f.cena, colW - 3, fs)) + 4;
      if (y + h > H - M){ doc.addPage(); y = M + 4; cabecera(); }
      if (f.hoy){ doc.setFillColor(255, 236, 219); doc.rect(M, y, W - 2*M, h, "F"); }
      doc.setDrawColor(200); doc.setLineWidth(0.2); doc.line(M, y + h, W - M, y + h);
      doc.setFont("helvetica", "bold"); doc.setFontSize(9); doc.setTextColor(60); doc.text(pdfTxt(f.dia), M + 2, y + 2 + lh * 0.78);
      if (f.cambio){ doc.setFillColor(224, 100, 12); doc.circle(M + dw - 3, y + 3.2, 0.9, "F"); }
      doc.setFont("helvetica", "normal"); doc.setTextColor(40);
      pdfItems(doc, f.comida, M + dw + 2, y + 2, colW - 3, y + h, fs);
      pdfItems(doc, f.cena, M + dw + colW + 2, y + 2, colW - 3, y + h, fs);
      y += h;
    });
    y += 6;
  });
  (extras || []).forEach(ex => {
    if (!ex.lineas.length) return;
    if (y + 16 > H - M){ doc.addPage(); y = M + 4; }
    doc.setFont("helvetica", "bold"); doc.setFontSize(10); doc.setTextColor(60); doc.text(pdfTxt(ex.titulo), M, y + 4); y += 7; doc.setFont("helvetica", "normal");
    doc.setFontSize(fs); doc.setTextColor(40);
    ex.lineas.forEach(t => { doc.splitTextToSize(pdfTxt(t), W - 2*M - 4).forEach((ln, k) => { if (y + lh > H - M){ doc.addPage(); y = M + 4; doc.setFontSize(fs); doc.setTextColor(40); } doc.text((k ? "   " : (/^\d+\./.test(t) ? "" : "- ")) + ln, M + 1, y + lh * 0.78); y += lh; }); });
    y += 4;
  });
  if (y + 6 > H - M){ doc.addPage(); y = M + 4; }
  pdfLeyenda(doc, M, y + 4);
  return doc;
}
const filaVacia = txt => [["otro", txt]];
function semanaSel(){ const cur = weekInfo(today()); const sem = S.ui.sem || cur.sem || 1; return { cur, sem, mon: proximasFechas(sem) }; }
async function descargarPDF(b){
  if (!S.downloads) return;
  const antes = b.innerHTML; b.disabled = true; b.textContent = "Preparando…";
  try{
    const J = await cargarJsPDF(); let doc, nombre; const modo = S.ui.modo || "semana"; const hoyS = today();
    if (modo === "cal"){
      const [y, m] = mesActual().split("-").map(Number);
      doc = pdfCal(J, y, m); nombre = `menu-calendario-${MESES[m-1]}-${y}.pdf`;
    } else if (modo === "mes"){
      const [y, m] = mesActual().split("-").map(Number); const first = new Date(y, m-1, 1), last = new Date(y, m, 0); const bloques = [];
      for (let mon = mondayOf(first); mon <= last; mon = addDays(mon, 7)){
        const wi = weekInfo(ymd(mon)); const filas = [];
        for (let i = 0; i < 7; i++){ const d = addDays(mon, i); if (d < first || d > last) continue; const ds = ymd(d); const dd = diaDe(ds);
          const v = filaVacia(dd.wi.fuera ? "Fuera" : "-");
          filas.push({ dia: `${DIAS3[i]} ${d.getDate()}`, comida: dd.dia ? itemsDe(dd.dia.comida) : v, cena: dd.dia ? itemsDe(dd.dia.cena) : v, cambio: !!dd.cambio, hoy: ds === hoyS }); }
        const tit = `${fmtCorto(mon)} - ${fmtCorto(addDays(mon, 6))} · ` + (wi.antes ? "Antes de empezar el menú" : semanaEnteraFuera(mon) ? "Semana fuera" : `Semana ${wi.sem} de la rotación`);
        bloques.push({ titulo: tit, filas });
      }
      doc = pdfLista(J, `Menú de ${MESES[m-1]} ${y}`, "COMIDAS · comida y cena de cada día", bloques); nombre = `menu-${MESES[m-1]}-${y}.pdf`;
    } else {
      const { sem, mon } = semanaSel(); const mm = S.data.menu["s"+sem];
      if (!mm){ toast("Esta semana no tiene menú"); return; }
      const filas = (mm.dias || []).map((d, i) => { if (!mon) return { dia: DIAS3[i], comida: itemsDe(d.comida), cena: itemsDe(d.cena) };
        const fd = addDays(mon, i), dd = diaDe(ymd(fd)), x = dd.dia || d;
        return { dia: `${DIAS3[i]} ${fd.getDate()}`, comida: itemsDe(x.comida), cena: itemsDe(x.cena), cambio: !!dd.cambio, hoy: ymd(fd) === hoyS }; });
      const extras = [];
      if (mm.fruta) extras.push({ titulo: "Fruta de la semana", lineas: [mm.fruta] });
      const bt = S.data.batch["s"+sem];
      if (bt){ const L = []; if (bt.duracion) L.push(bt.duracion); (bt.previo||[]).forEach(t => L.push("Antes: " + t)); (bt.pasos||[]).forEach((t, k) => L.push(`${k+1}. ${t}`));
        (bt.nevera||[]).forEach(t => L.push("Nevera: " + t)); (bt.congelador||[]).forEach(t => L.push("Congelador: " + t)); (bt.entresemana||[]).forEach(t => L.push("Entre semana: " + t)); (bt.avisos||[]).forEach(t => L.push("Seguridad: " + t));
        extras.push({ titulo: "Batch cooking: " + (bt.titulo || "domingo"), lineas: L }); }
      doc = pdfLista(J, `Semana ${sem}`, mon ? `${fmtCorto(mon)} - ${fmtCorto(addDays(mon, 6))} · COMIDAS` : "COMIDAS", [{ titulo: `Semana ${sem} de la rotación`, filas }], extras);
      nombre = `menu-semana-${sem}${mon ? "-" + ymd(mon) : ""}.pdf`;
    }
    await S.downloads.save({ filename: nombre, data: doc.output("blob") });
    toast("PDF descargado");
  } catch(e){
    const c = e && e.code;
    if (c === "declined"){ /* el usuario dijo que no */ }
    else if (c === "rate_limited") toast("Espera un momento y vuelve a probar.");
    else if (c && ["unavailable","not_granted","capability_disabled","capability_removed","extension_not_enabled"].includes(c)){ toast("No se ha podido descargar el PDF."); }
    else toast("No he podido crear el PDF. Prueba otra vez.");
  } finally { if (b.isConnected){ b.disabled = false; b.innerHTML = antes; } }
}

/* ---------- Claude ---------- */
function contexto(){
  const ds = today(), wi = weekInfo(ds), d = parse(ds);
  const nom = id => R(id).nombre;
  const slotTxt = s => s ? [s.primero && nom(s.primero), s.plato && nom(s.plato)].filter(Boolean).join(" + ") + (s.nota ? ` (${s.nota})` : "") : "-";
  let semTxt = "";
  if (wi.sem){ const m = S.data.menu["s"+wi.sem]; if (m) semTxt = (m.dias||[]).map((x,i)=>`${DIAS[i]}: comida ${slotTxt(x.comida)}; cena ${slotTxt(x.cena)}`).join("\n"); }
  const hoyM = diaDe(ds).dia;
  return { ds, d, wi, semTxt, hoyTxt: hoyM ? `Comida: ${slotTxt(hoyM.comida)}. Cena: ${slotTxt(hoyM.cena)}.` : (wi.antes ? "El menú aún no ha empezado (empieza el lunes 23 de noviembre)." : "Sin menú hoy.") };
}
const PERFIL = "";
async function askHoy(k){
  if (!S.sample) return;
  const c = contexto();
  const desayunos = Object.values(S.data.recetas).filter(r=>r.tipo==="desayuno").map(r=>"- "+r.nombre).join("\n");
  const desp = Object.values(S.data.despensa).filter(x=>(x.estado||"hay")!=="falta").map(x=>x.nombre+(x.estado==="poco"?" (queda poco)":"")).join(", ");
  const recetas = Object.values(S.data.recetas).filter(r=>r.tipo!=="desayuno").map(r=>r.nombre).join("; ");
  const fm = frutaMes(c.d.getMonth());
  let prompt;
  if (k === "desayuno") prompt = `${PERFIL}\n\nHoy es ${fmtLargo(c.d)}. ${c.hoyTxt}\nMenú de la semana:\n${c.semTxt || "(no disponible)"}\n\nOpciones de desayuno de su lista:\n${desayunos}\nFruta de temporada: ${fm ? fm.frutas.join(", ") : "la que haya"}.\n\nSugiere 1 o 2 desayunos de su lista para hoy (prefiere contundentes), teniendo en cuenta lo que come y cena hoy y lo que lleva en la semana (por ejemplo, si ya hay mucho huevo, otra opción). Añade qué pieza de fruta tomar. Máximo 5 líneas.`;
  else prompt = `${PERFIL}\n\nHoy es ${fmtLargo(c.d)}. ${c.hoyTxt}\nLo que tiene en casa ahora: ${desp || "(despensa sin datos)"}.\nSu recetario: ${recetas}.\n\n¿Qué puede cocinar hoy con lo que tiene? Da 2 o 3 ideas concretas priorizando su recetario y lo que esté en la despensa, cada una con lo que le faltaría si le falta algo y el tiempo aproximado. Máximo 10 líneas.`;
  S.ui.ai.hoy = { loading: true, text: "" }; render();
  try{
    const r = await S.sample(prompt, { cache: false, onText: ({text}) => { S.ui.ai.hoy.text = text; const el = $("#ai-hoy"); if (el) el.textContent = text; } });
    S.ui.ai.hoy = { text: r.text };
  } catch(e){ if (e && e.code === "not_granted") S.sample = null; S.ui.ai.hoy = { error: e && e.code === "rate_limited" ? "Muchas preguntas seguidas. Prueba en un rato." : "Ahora no puedo responder. Inténtalo más tarde." }; }
  render();
}
async function askReceta(id){
  if (!S.sample) return; const r = R(id); const key = "r:"+id;
  S.ui.ai[key] = { loading: true, text: "" }; render();
  const prompt = `${PERFIL}\n\nEscribe la receta de "${r.nombre}" para su recetario. ${r.tupper ? "Va en tupper y se recalienta en microondas." : ""} ${r.congela ? "Se congela." : ""} Cantidades para ${r.tipo==="comida"||r.tipo==="primero" ? "2 raciones" : "1 ración"} (una persona), raciones de plato saludable. Usa airfryer o vitrocerámica, nunca horno. Devuelve SOLO un objeto JSON con estas claves: "raciones" (texto corto), "ingredientes" (array de textos con cantidad), "pasos" (array de 4 a 8 pasos cortos), "tiempo" (número de minutos), "conserva" (una frase sobre nevera y congelador).`;
  try{
    const res = await S.sample(prompt, { cache: false, onText: () => { const el = $("#ai-receta"); if (el) el.textContent = "Escribiendo la receta…"; } });
    const m = String(res.text).match(/\{[\s\S]*\}/); const j = JSON.parse(m ? m[0] : res.text);
    const upd = { ingredientes: (j.ingredientes||[]).map(String), pasos: (j.pasos||[]).map(String) };
    if (j.raciones) upd.raciones = String(j.raciones); if (j.conserva) upd.conserva = String(j.conserva); if (!r.tiempo && Number(j.tiempo)) upd.tiempo = Number(j.tiempo);
    delete S.ui.ai[key];
    await W(S.db.doc("recetas/"+id).update(upd), "Receta guardada");
  } catch(e){ if (e && e.code === "not_granted") S.sample = null; S.ui.ai[key] = { error: "No he podido escribir la receta ahora. Inténtalo más tarde." }; }
  render();
}

/* ---------- arranque ---------- */
function routeFromHash(){ const h = location.hash.replace("#",""); if (VIEWS[h]) S.ui.route = h; }
window.addEventListener("hashchange", () => { routeFromHash(); render(); });
async function init(){
  routeFromHash();
  const C = window.FIREBASE_CONFIG || {};
  if (!C.apiKey || !C.projectId || typeof firebase === "undefined"){ S.noConfig = true; setSync(""); render(); return; }
  render();
  firebase.initializeApp(C);
  S.auth = firebase.auth(); S.fs = firebase.firestore();
  try{ S.fs.settings({ ignoreUndefinedProperties: true }); }catch(e){}
  try{ await S.fs.enablePersistence({ synchronizeTabs: true }); }catch(e){}
  S.downloads = { save: async ({ filename, data }) => { const url = URL.createObjectURL(data); const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); } };
  S.auth.getRedirectResult().catch(e => loginMsg(authErr(e)));
  S.auth.onAuthStateChanged(u => conectar(u));
}
let UNSUB = [], syncTimer = null;
function conectar(u){
  UNSUB.forEach(f => { try{ f(); }catch(e){} }); UNSUB = []; clearTimeout(syncTimer);
  S.authReady = true; S.user = u || null; S.db = null; S.ready = new Set(); S.data = Object.fromEntries(COLS.map(c => [c, {}]));
  S.ui.imp = null; S.ui.impMsg = null;
  if (!u){ setSync(""); render(); return; }
  S.ui.loginMsg = null; setSync("Cargando…");
  const base = "users/" + u.uid + "/";
  S.db = { collection: c => S.fs.collection(base + c), doc: p => S.fs.doc(base + p) };
  syncTimer = setTimeout(() => { if (S.ready.size < COLS.length) setSync(S.ready.size ? "Puede no estar al día" : "Sin conexión", "bad"); }, 10000);
  COLS.forEach(c => {
    UNSUB.push(S.db.collection(c).onSnapshot(snap => {
      if (S.user !== u) return;
      const m = {}; snap.docs.forEach(d => { m[d.id] = d.data(); }); S.data[c] = m;
      if (!snap.metadata.fromCache) S.ready.add(c);
      if (S.ready.size === COLS.length){ clearTimeout(syncTimer); setSync(""); }
      schedule();
    }, err => { S.ready.add(c); setSync("Error al leer los datos", "bad"); schedule(); }));
  });
  render();
}
init();
